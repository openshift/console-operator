apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-downloads
  namespace: openshift-console
  annotations:
    include.release.openshift.io/hypershift: "true"
    include.release.openshift.io/ibm-cloud-managed: "true"
    include.release.openshift.io/self-managed-high-availability: "true"
    include.release.openshift.io/single-node-developer: "true"
    capability.openshift.io/name: Console
    kubernetes.io/description: >-
      Allow ingress from the OpenShift router to the downloads server
      pods. The router (openshift-ingress namespace) terminates
      external TLS and forwards traffic to port 8080 where the
      downloads server serves CLI binary archives (oc, kubectl).
spec:
  podSelector:
    matchLabels:
      app: console
      component: downloads
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          network.openshift.io/policy-group: ingress
    ports:
    - protocol: TCP
      port: 8080
  policyTypes:
  - Ingress
