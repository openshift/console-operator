apiVersion: console.openshift.io/v1
kind: ConsoleCLIDownload
metadata:
  name: helm-download-links
  annotations:
    include.release.openshift.io/hypershift: "true"
    include.release.openshift.io/ibm-cloud-managed: "true"
    include.release.openshift.io/self-managed-high-availability: "true"
    include.release.openshift.io/single-node-developer: "true"
    capability.openshift.io/name: Console
spec:
  description: |
    Helm 4 is a package manager for Kubernetes. You can use it to define,
    install, and upgrade applications packaged as Helm charts.
    Use Helm 4 with OpenShift Container Platform (OCP).
  displayName: helm - Helm 4 CLI
  links:
    - href: 'https://mirror.openshift.com/pub/cgw/helm/4.3.0'
      text: Download Helm v4
---
apiVersion: console.openshift.io/v1
kind: ConsoleCLIDownload
metadata:
  name: helm3-download-links
  annotations:
    include.release.openshift.io/hypershift: "true"
    include.release.openshift.io/ibm-cloud-managed: "true"
    include.release.openshift.io/self-managed-high-availability: "true"
    include.release.openshift.io/single-node-developer: "true"
    capability.openshift.io/name: Console
spec:
  description: |
    Helm 3 is a package manager for Kubernetes. You can use it to define,
    install, and upgrade applications packaged as Helm charts. Helm 3
    remains available for existing workflows, but future OpenShift Container Platform
    (OCP) releases do not support it. To keep your applications compatible, upgrade to
    Helm 4.
  displayName: helm - Helm 3 CLI
  links:
    - href: 'https://mirror.openshift.com/pub/openshift-v4/clients/helm/latest'
      text: Download Helm v3
