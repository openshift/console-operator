apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-console-ui
  namespace: openshift-console
  annotations:
    include.release.openshift.io/hypershift: "true"
    include.release.openshift.io/ibm-cloud-managed: "true"
    include.release.openshift.io/self-managed-high-availability: "true"
    include.release.openshift.io/single-node-developer: "true"
    capability.openshift.io/name: Console
    kubernetes.io/description: >-
      Allow ingress from the OpenShift router and monitoring stack to
      the console UI pods. The router (openshift-ingress namespace)
      terminates external TLS and forwards traffic to port 8443 for
      the main console service and port 8444 for the custom-route
      redirect service. The monitoring stack (openshift-monitoring
      namespace) scrapes Prometheus metrics from port 8443 via the
      console ServiceMonitor.
spec:
  podSelector:
    matchLabels:
      app: console
      component: ui
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          network.openshift.io/policy-group: ingress
    ports:
    - protocol: TCP
      port: 8443
    - protocol: TCP
      port: 8444
  - from:
    - namespaceSelector:
        matchLabels:
          network.openshift.io/policy-group: monitoring
    ports:
    - protocol: TCP
      port: 8443
  policyTypes:
  - Ingress
