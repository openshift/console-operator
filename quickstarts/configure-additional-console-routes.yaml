apiVersion: console.openshift.io/v1
kind: ConsoleQuickStart
metadata:
  annotations:
    capability.openshift.io/name: Console
    include.release.openshift.io/ibm-cloud-managed: "true"
    include.release.openshift.io/self-managed-high-availability: "true"
    include.release.openshift.io/single-node-developer: "true"
  name: configure-additional-console-routes
spec:
  accessReviewResources:
    - group: config.openshift.io
      resource: ingresses
      verb: patch
  displayName: Configuring additional routes for the web console
  durationMinutes: 10
  description: >-
    Make the web console available at additional hostnames, each with an optional
    Transport Layer Security (TLS) certificate, by using the Ingress
    `componentRoutes` API.
  icon: >-
    data:image/svg+xml;base64,
  tags:
    - console
    - networking
    - routes
    - ingress
    - administrator
  prerequisites:
    - You have access to an OpenShift cluster as a user with the **cluster-admin** role.
    - Your cluster runs OpenShift Container Platform 5.0 or later.
    - 'If you plan to use a hostname outside the cluster''s default domain, you
      have created a DNS record that points the hostname to the cluster router.'
    - 'If you plan to serve a custom TLS certificate, you have a certificate and
      key pair in Privacy-Enhanced Mail (PEM) format.'
  introduction: |-
    In this quick start, you make the web console available at an additional address.

    By default, the web console is available at a single URL, such as
    `https://console-openshift-console.apps.example.com`. OpenShift derives this URL
    from the cluster's default domain.

    As a cluster administrator, you can make the console available at additional
    addresses by adding entries to the `spec.componentRoutes` list of the cluster
    Ingress configuration. Each entry creates an additional console route with its
    own hostname and, optionally, its own TLS certificate.

    After you add an entry, the Console Operator automatically:

    - Creates a route for the hostname in the `openshift-console` namespace
    - Registers the new address with the cluster OAuth server so that users can log in with single sign-on at that address
    - Configures the console to return users to the new address after they log in there

    The default console URL continues to work alongside every additional address.
  tasks:
    - title: Understand when to use additional console routes
      description: |-
        Additional console routes let different audiences reach the console through
        different hostnames.

        Common use cases include:

        - **Network segmentation**: Serve the console to administrators on a hostname that is reachable only from an internal network, while the default address serves a wider audience.
        - **Separate addresses for user groups**: Give internal teams and external partners distinct, easy-to-recognize addresses for the same console.
        - **DNS migrations**: Keep the console available under a new domain while the old address is still in use.

        All addresses point to the same console, so you do not need to run or manage extra pods.

        Decide on the values for your new endpoint:

        1. **Name**: A unique name for the route, such as `console-internal`. The name must begin with `console` and cannot be `console` or `console-custom`, because the Console Operator reserves those names for the default console route and the legacy custom route.
        2. **Hostname**: The address where users can reach the console. OpenShift automatically routes hostnames that use the cluster's default domain, such as `console-2-openshift-console.apps.example.com`. Any other hostname requires a DNS record that points to the cluster router.
        3. **TLS certificate**: Optional for hostnames under the cluster's default domain because the default ingress certificate covers them. Hostnames outside the default domain need their own certificate to avoid browser warnings.
      review:
        instructions: |-
          #### Verify that you are ready to configure the route

          - You have chosen a name that begins with `console`.
          - You know which hostname to use, and whether it is under the cluster's default domain.
        failedTaskHelp: >-
          This task is not verified yet. Review the requirements for the name, the
          hostname, and the TLS certificate, and try again.
      summary:
        success: You know when to use additional console routes and what each endpoint requires.
        failed: Review the requirements and try again.
    - title: Navigate to the Ingress configuration
      description: |-
        The cluster Ingress configuration controls component routes, including the console routes.

        1. In the [Administration]{{highlight qs-nav-administration}} section of the navigation, click **Cluster Settings**.

        2. Click the **Configuration** tab.

        3. In the list of configuration resources, click **Ingress** to open its details page.

        The Ingress resource is named `cluster`. You define additional console endpoints in its `spec.componentRoutes` list.
      review:
        instructions: |-
          To verify that you are in the right place:

          - The page title is **Ingress details**.
          - The resource name is **cluster**.
        failedTaskHelp: >-
          This task is not verified yet. Make sure you opened **Cluster Settings**,
          clicked the **Configuration** tab, and then clicked the **Ingress** resource.
      summary:
        success: You opened the Ingress configuration.
        failed: Open **Cluster Settings**, click the **Configuration** tab, and open the **Ingress** resource.
    - title: Add a componentRoutes entry for the console
      description: |-
        Additional console endpoints are entries in the `spec.componentRoutes` list.

        1. On the **Ingress details** page, click the **YAML** tab to open the editor.

        2. In the `spec` section, find the `componentRoutes` list. If the list does not exist, add it.

        3. Add an entry for your endpoint:

           ```
           spec:
             componentRoutes:
               - name: console-2
                 namespace: openshift-console
                 hostname: console-2-openshift-console.apps.example.com
           ```{{copy}}

        4. Replace `console-2` and the hostname with your own values:

           - `name` must begin with `console` and must not be `console` or `console-custom`.
           - `namespace` must be `openshift-console`.
           - `hostname` must be unique in the cluster.

        5. Click **Save**.

        ### Edit by using the CLI

        Instead of using the console, you can edit the Ingress configuration from the CLI. Run the following command, add the entry from step 3, and save your changes:

        `oc edit ingress.config.openshift.io cluster`{{execute}}

        ### What happens next

        It can take up to a minute for the Console Operator to complete the following actions:

        - Creates a route named after your entry in the `openshift-console` namespace
        - Registers `https://<your-hostname>/auth/callback` with the cluster OAuth server
        - Adds the hostname to the console configuration so that the console returns users to the new address after they log in there
      review:
        instructions: |-
          #### Verify that the entry was saved

          1. On the **Ingress details** page, click the **YAML** tab.

          2. Confirm that the `spec.componentRoutes` list displays your entry with the name, namespace, and hostname you chose.
        failedTaskHelp: >-
          This task is not verified yet. Make sure the entry is indented correctly
          under `spec.componentRoutes`, and that the name begins with `console`. For
          reference, see the [OpenShift documentation on customizing the console
          route](https://docs.redhat.com/en/documentation/openshift_container_platform/5.0/observability/web_console/web-console#customizing-the-console-route_customizing-web-console).
      summary:
        success: The Ingress configuration now contains an entry for your new console endpoint.
        failed: Review your entry under `spec.componentRoutes` and correct the name, namespace, or hostname.
    - title: Add a custom TLS certificate (optional)
      description: |-
        Hostnames outside the cluster's default domain need their own certificate.

        Skip this task if your hostname is under the cluster's default domain. The default ingress certificate already covers it.

        For any other hostname, provide a TLS certificate so that browsers trust the new console address. Store the certificate and key in a secret of type `kubernetes.io/tls` in the `openshift-config` namespace. The certificate must be valid and must cover the hostname you configured.

        1. If you have not already done so, create a secret that contains your certificate and key:

        `oc create secret tls console-2-certs --cert=certificate.crt --key=private.key -n openshift-config`{{execute}}

        Replace `console-2-certs`, `certificate.crt`, and `private.key` with your own values.

        2. On the **Ingress details** page, click the **YAML** tab and add `servingCertKeyPairSecret` to the entry from the previous task. Keep the `name`, `namespace`, and `hostname` values that you chose there:

           ```
           spec:
             componentRoutes:
               - name: console-2
                 namespace: openshift-console
                 hostname: <your-hostname>
                 servingCertKeyPairSecret:
                   name: console-2-certs
           ```{{copy}}

        3. Click **Save**.

        After you save, the Console Operator applies the certificate to the route.
      review:
        instructions: |-
          #### Verify that the certificate is configured

          1. Confirm that the secret exists:

          `oc get secret console-2-certs -n openshift-config`{{execute}}

          2. Confirm that your `componentRoutes` entry includes `servingCertKeyPairSecret.name`.
        failedTaskHelp: >-
          This task is not verified yet. Confirm that the secret exists in the
          `openshift-config` namespace, that it is of type `kubernetes.io/tls`, and
          that the `servingCertKeyPairSecret.name` field in your entry references it.
      summary:
        success: Your new console endpoint serves the certificate you provided.
        failed: Review the TLS secret and the `servingCertKeyPairSecret` reference in your entry.
    - title: Verify that the route exists and is accessible
      description: |-
        The Console Operator creates a route for each additional console endpoint.

        **Note**: It can take up to a minute after you save the Ingress configuration for the route to be displayed.

        1. In the navigation, go to **Networking** → **Routes**.

        2. In the **Project** dropdown menu, select **openshift-console**.

        3. Find the route named after your entry, such as `console-2`. The **Hostname** column shows the address you configured.

        4. Open `https://<your-hostname>` in a browser and log in with your usual credentials.

        After you log in, the console returns you to the same address, not to the original console URL.

        To list the additional console routes from a terminal, run:

        `oc get routes -n openshift-console -l console.openshift.io/additional-route=true`{{execute}}
      review:
        instructions: |-
          #### Verify that the new console endpoint works

          1. Open `https://<your-hostname>` in a browser.

          2. Log in with your usual credentials.

          3. Confirm that the console loads and that the address bar still shows your hostname after login.
        failedTaskHelp: >-
          This task is not verified yet. If the route is not displayed, wait a minute
          and refresh the **Routes** page. Check that the `componentRoutes` entry uses
          the `openshift-console` namespace and that the name begins with `console`.
          For a hostname outside the default domain, confirm that the DNS record
          points to the cluster router and that your entry references the correct
          secret. For more information, see the
          [OpenShift documentation on customizing the console
          route](https://docs.redhat.com/en/documentation/openshift_container_platform/5.0/observability/web_console/web-console#customizing-the-console-route_customizing-web-console).
      summary:
        success: The web console is now available at your additional address.
        failed: Confirm that the route is displayed and that you can log in at your hostname.
  conclusion: |-
    You have made the web console available at an additional address. The console now serves both the original URL and every hostname you configured. After users log in, the console returns them to the address where they started.

    To remove an endpoint later, delete its entry from `spec.componentRoutes` in the Ingress configuration. The Console Operator removes the corresponding route. Remove any DNS record or TLS secret that you created for the hostname and no longer need.

    For more information, see the [OpenShift documentation on customizing the console route](https://docs.redhat.com/en/documentation/openshift_container_platform/5.0/observability/web_console/web-console#customizing-the-console-route_customizing-web-console).
  nextQuickStart: []
